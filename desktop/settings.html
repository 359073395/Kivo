<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'"><title>桌面版设置</title><style>body{font:15px system-ui;color:#1c303b;background:#f5f8fa;padding:26px;line-height:1.8}input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #9cbdc5;border-radius:8px}button{padding:9px 16px;margin:14px 10px 14px 0;border:0;border-radius:8px;background:#117f91;color:white;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}#note{padding:12px;background:#e2eef0;white-space:pre-wrap}small{color:#546776}</style></head><body><h2>Kivo桌面版 · 升级设置</h2><p id="version"></p><label>HTTPS升级源目录<input id="url" placeholder="https://您的域名或GitHub发布目录/" /></label><small>目录需提供 latest.yml、安装包和 blockmap。只填写您信任的发布源；不会自动上传本机数据。</small><div><button id="save">保存升级源</button><button id="check">检查更新</button></div><p id="note" role="status">尚未开始检查。</p><details><summary>本机数据位置</summary><pre id="paths"></pre></details><script src="settings.cjs"></script></body></html>
