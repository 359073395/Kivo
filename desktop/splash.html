<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'"><title>Kivo 创作工作台</title>
<style>body{margin:0;background:#101820;color:#eaf3f5;font:14px system-ui;line-height:1.7;display:grid;place-items:center;min-height:100vh}main{width:min(640px,80vw)}h1{font-size:24px}#status{color:#8bd5d5;white-space:pre-wrap;overflow-wrap:anywhere;min-height:52px}small{font-size:12px;color:#9daeb8;display:block}progress{width:100%;accent-color:#8bd5d5;margin:16px 0}button{font:inherit;color:#eaf3f5;background:#203640;border:1px solid #45616d;border-radius:8px;padding:9px 18px;margin:20px 10px 0 0;cursor:pointer}button:hover{background:#34515c}[hidden]{display:none}</style></head>
<body><main><h1>Kivo 创作工作台</h1><p id="status" role="status" aria-live="polite">正在启动本机服务…</p><progress id="progress" aria-label="启动进度"></progress><small id="elapsed">已等待 0 秒</small><small id="hint">知识与账号数据和程序分开保存。校验在后台进行，不会锁住窗口。</small><button id="logs">打开日志文件夹</button><button id="retry" hidden>重新启动</button></main><script src="splash.cjs"></script></body></html>
